<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سينما الحب 🍿❤️</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <style>
        body { background-color: #111; color: #fff; font-family: Arial, sans-serif; text-align: center; padding: 20px; margin: 0; }
        .container { max-width: 800px; margin: 0 auto; }
        h1 { color: #e50914; font-size: 26px; margin-bottom: 5px; }
        video { width: 100%; border-radius: 12px; box-shadow: 0 4px 20px rgba(229, 9, 20, 0.5); background: #000; margin-top: 15px; display: none; }
        .card { background: #1a1a1a; padding: 20px; border-radius: 12px; border: 1px solid #333; margin-top: 15px; }
        input { width: 80%; padding: 12px; border-radius: 8px; border: 1px solid #444; background: #222; color: white; margin-bottom: 12px; text-align: center; font-size: 16px; }
        button { padding: 12px 24px; background: #e50914; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 15px; margin: 5px; }
        .btn-sec { background: #333; border: 1px solid #444; }
        .badge { display: inline-block; padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: bold; margin-top: 10px; }
        .room-title { font-size: 22px; color: #e50914; font-weight: bold; letter-spacing: 2px; }
        .users-count { background: #0277bd; color: white; padding: 4px 10px; border-radius: 10px; font-size: 12px; margin-left: 5px; }
        .role-section { margin-bottom: 15px; }
        .active-role { background: #e50914 !important; border-color: #e50914; }
        .chat-card { background: #151515; border: 1px solid #222; border-radius: 12px; margin-top: 20px; display: none; text-align: right; padding: 15px; }
        .chat-box { height: 150px; overflow-y: auto; background: #000; border: 1px solid #333; border-radius: 8px; padding: 10px; margin-bottom: 10px; font-size: 14px; display: flex; flex-direction: column; }
        .msg { margin: 4px 0; padding: 6px 12px; border-radius: 8px; max-width: 70%; word-wrap: break-word; line-height: 1.4; }
        .msg.me { background: #e50914; color: white; align-self: flex-start; border-bottom-right-radius: 0; }
        .msg.partner { background: #333; color: white; align-self: flex-end; border-bottom-left-radius: 0; }
        .chat-input-row { display: flex; gap: 10px; }
        .chat-input-row input { margin-bottom: 0; flex-grow: 1; text-align: right; }
        .chat-input-row button { margin: 0; padding: 10px 20px; }
        .timer-card { background: #222; padding: 10px; border-radius: 8px; color: #ff9800; font-size: 18px; margin: 10px 0; }
    </style>
</head>
<body>
<div class="container">
    <h1>سينما الحب 🍿❤️</h1>
    <div id="usersBadge" class="badge" style="background:#333; display:none;">
        المتواجدون حالياً بالغرفة: <span id="countDisplay" class="users-count">1</span>
    </div>

    <div class="card" id="setupCard">
        <div class="role-section">
            <button id="adminBtn" class="active-role" onclick="setRole('ADMIN')">🎬 أنا المتحكم (مصطفى)</button>
            <button id="viewerBtn" class="btn-sec" onclick="setRole('VIEWER')">🍿 أنا المشاهد (نونة)</button>
        </div>
        <div id="adminAction">
            <button onclick="createNewRoom()">✨ إنشاء غرفة جديدة برقم قصير</button>
        </div>
        <div id="viewerAction" style="display:none; margin-top: 15px;">
            <input type="number" id="roomCodeInput" placeholder="🔢 ادخلي رقم الغرفة...">
            <br>
            <button onclick="joinExistingRoom()">💕 دخول الغرفة والاتصال بمصطفى</button>
            <p id="joinStatus" style="font-size:13px; color:#aaa;"></p>
        </div>
    </div>

    <div class="card" id="broadcastCard" style="display:none;">
        <div class="room-title">🎥 رقم الغرفة: <span id="roomCodeDisplay">----</span></div>
        <div id="timerCard" class="timer-card" style="display:none;">
            ⏳ صلاحية الغرفة: <span id="timerDisplay">05:00</span>
        </div>
        <div id="adminInputs" style="margin-top: 15px;">
            <input type="text" id="videoUrl" placeholder="🔗 ألصق رابط الفيلم هنا...">
            <br>
            <button onclick="loadVideo()">▶️ بث الفيلم للطرفين</button>
        </div>
        <div id="viewerInputs" style="display:none; color: #aaa; margin-top:10px;">
            💖 انتظري مصطفى ليقوم ببث الفيلم...
        </div>
    </div>

    <video id="videoPlayer" playsinline controls></video>

    <div class="chat-card" id="chatCard">
        <div style="font-weight: bold; margin-bottom: 8px; color: #aaa; font-size: 14px;">💬 دردشة السينما</div>
        <div class="chat-box" id="chatBox"></div>
        <div class="chat-input-row">
            <input type="text" id="chatInput" placeholder="✍️ اكتب رسالة..." onkeypress="handleChatKey(event)">
            <button onclick="sendChatMessage()">📨 إرسال</button>
        </div>
    </div>
</div>

<script>
    // ========== إعدادات Firebase (من مشروعك cenama-9093f) ==========
    const firebaseConfig = {
        apiKey: "AIzaSyCu62w7jzvxYvxPFdd65FbACIYohoXQ3Yk",
        authDomain: "cenama-9093f.firebaseapp.com",
        databaseURL: "https://cenama-9093f-default-rtdb.firebaseio.com",
        projectId: "cenama-9093f",
        storageBucket: "cenama-9093f.firebasestorage.app",
        messagingSenderId: "106569940197",
        appId: "1:106569940197:web:a5afbdb78e97eecc5f280c",
        measurementId: "G-DLD3BQCFCR"
    };

    // ========== تهيئة Firebase ==========
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    // ========== عناصر الصفحة ==========
    const video = document.getElementById('videoPlayer');
    const countDisplay = document.getElementById('countDisplay');
    const chatCard = document.getElementById('chatCard');
    const chatBox = document.getElementById('chatBox');
    const chatInput = document.getElementById('chatInput');
    const joinStatus = document.getElementById('joinStatus');
    const timerCard = document.getElementById('timerCard');
    const timerDisplay = document.getElementById('timerDisplay');
    const roomCodeDisplay = document.getElementById('roomCodeDisplay');

    let myRole = 'ADMIN';
    let currentRoomCode = null;
    let isSyncing = false;
    let timerInterval = null;
    let roomExpired = false;
    const ROOM_TIMEOUT_SEC = 300;
    let remainingSeconds = ROOM_TIMEOUT_SEC;

    // ========== دوال مساعدة ==========
    function setRole(role) {
        myRole = role;
        document.getElementById('adminBtn').className = role === 'ADMIN' ? 'active-role' : 'btn-sec';
        document.getElementById('viewerBtn').className = role === 'VIEWER' ? 'active-role' : 'btn-sec';
        document.getElementById('adminAction').style.display = role === 'ADMIN' ? 'block' : 'none';
        document.getElementById('viewerAction').style.display = role === 'VIEWER' ? 'block' : 'none';
    }

    function startExpiryTimer() {
        if (timerInterval) clearInterval(timerInterval);
        remainingSeconds = ROOM_TIMEOUT_SEC;
        roomExpired = false;
        timerCard.style.display = 'block';
        updateTimerDisplay();
        timerInterval = setInterval(() => {
            remainingSeconds--;
            updateTimerDisplay();
            if (remainingSeconds <= 0) {
                clearInterval(timerInterval);
                roomExpired = true;
                timerDisplay.textContent = "انتهت ⚠️";
                timerCard.style.color = "#f44336";
                appendSystemMessage("⚠️ صلاحية الغرفة انتهت. أنشئ غرفة جديدة.");
                database.ref('rooms/' + currentRoomCode).remove();
            }
        }, 1000);
    }

    function updateTimerDisplay() {
        const m = Math.floor(remainingSeconds / 60);
        const s = remainingSeconds % 60;
        timerDisplay.textContent = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    function showCinemaLayout(code) {
        document.getElementById('setupCard').style.display = 'none';
        document.getElementById('broadcastCard').style.display = 'block';
        roomCodeDisplay.textContent = code;
        document.getElementById('usersBadge').style.display = 'inline-block';
        countDisplay.textContent = '1';
        video.style.display = 'block';
        chatCard.style.display = 'block';
    }

    // ========== إنشاء غرفة (متحكم) ==========
    function createNewRoom() {
        currentRoomCode = Math.floor(1000 + Math.random() * 9000).toString();
        database.ref('rooms/' + currentRoomCode).set({
            videoUrl: '',
            state: 'pause',
            currentTime: 0,
            createdAt: firebase.database.ServerValue.TIMESTAMP
        });

        // متابعة المشاهد
        database.ref('rooms/' + currentRoomCode + '/viewerPresent').on('value', snap => {
            countDisplay.textContent = snap.val() ? '2' : '1';
            countDisplay.style.background = snap.val() ? '#2e7d32' : '#0277bd';
        });

        // متابعة الدردشة
        database.ref('rooms/' + currentRoomCode + '/chat').on('child_added', snap => {
            const msg = snap.val();
            if (msg.sender !== 'ADMIN') appendMessage(msg.text, 'partner');
        });

        showCinemaLayout(currentRoomCode);
        video.controls = true;
        startExpiryTimer();
    }

    // ========== انضمام (مشاهدة) ==========
    function joinExistingRoom() {
        const code = document.getElementById('roomCodeInput').value.trim();
        if (!code) return alert('الرجاء إدخال رقم الغرفة!');

        joinStatus.textContent = 'جاري البحث...';
        database.ref('rooms/' + code).once('value', snap => {
            if (!snap.exists()) {
                joinStatus.textContent = '❌ الغرفة غير موجودة';
                return;
            }

            currentRoomCode = code;
            database.ref('rooms/' + code + '/viewerPresent').set(true);

            // متابعة حالة الفيديو
            database.ref('rooms/' + code + '/state').on('value', s => {
                if (isSyncing) return;
                const state = s.val();
                database.ref('rooms/' + code + '/currentTime').once('value', t => {
                    const time = t.val() || 0;
                    if (state === 'play') { video.currentTime = time; video.play(); }
                    else if (state === 'pause') video.pause();
                    else if (state === 'seek') video.currentTime = time;
                });
            });

            // متابعة رابط الفيديو
            database.ref('rooms/' + code + '/videoUrl').on('value', s => {
                if (s.val()) { video.src = s.val(); video.load(); }
            });

            // متابعة الدردشة
            database.ref('rooms/' + code + '/chat').on('child_added', snap => {
                const msg = snap.val();
                if (msg.sender !== 'VIEWER') appendMessage(msg.text, 'partner');
            });

            showCinemaLayout(code);
            document.getElementById('adminInputs').style.display = 'none';
            document.getElementById('viewerInputs').style.display = 'block';
            video.controls = false;
            joinStatus.textContent = '✅ متصلة';
            joinStatus.style.color = '#4caf50';
        });
    }

    // ========== دردشة ==========
    function sendChatMessage() {
        const text = chatInput.value.trim();
        if (text && currentRoomCode) {
            database.ref('rooms/' + currentRoomCode + '/chat').push({
                text, sender: myRole,
                timestamp: firebase.database.ServerValue.TIMESTAMP
            });
            appendMessage(text, 'me');
            chatInput.value = '';
        }
    }

    function handleChatKey(e) { if (e.key === 'Enter') sendChatMessage(); }

    function appendMessage(text, sender) {
        const d = document.createElement('div');
        d.className = `msg ${sender}`;
        d.textContent = text;
        chatBox.appendChild(d);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function appendSystemMessage(text) {
        const d = document.createElement('div');
        d.style.cssText = 'color:#4caf50;font-size:12px;text-align:center;margin:5px 0';
        d.textContent = text;
        chatBox.appendChild(d);
    }

    // ========== بث الفيديو ==========
    function loadVideo() {
        const url = document.getElementById('videoUrl').value;
        if (url && myRole === 'ADMIN' && currentRoomCode) {
            video.src = url;
            video.load();
            database.ref('rooms/' + currentRoomCode).update({ videoUrl: url, state: 'pause' });
        }
    }

    // ========== أحداث التحكم ==========
    video.addEventListener('play', () => {
        if (!isSyncing && myRole === 'ADMIN' && currentRoomCode) {
            isSyncing = true;
            database.ref('rooms/' + currentRoomCode).update({ state: 'play', currentTime: video.currentTime });
            setTimeout(() => isSyncing = false, 100);
        }
    });
    video.addEventListener('pause', () => {
        if (!isSyncing && myRole === 'ADMIN' && currentRoomCode) {
            isSyncing = true;
            database.ref('rooms/' + currentRoomCode).update({ state: 'pause' });
            setTimeout(() => isSyncing = false, 100);
        }
    });
    video.addEventListener('seeked', () => {
        if (!isSyncing && myRole === 'ADMIN' && currentRoomCode) {
            isSyncing = true;
            database.ref('rooms/' + currentRoomCode).update({ state: 'seek', currentTime: video.currentTime });
            setTimeout(() => isSyncing = false, 100);
        }
    });

    // تنظيف عند الخروج
    window.addEventListener('beforeunload', () => {
        if (myRole === 'VIEWER' && currentRoomCode) {
            database.ref('rooms/' + currentRoomCode + '/viewerPresent').set(false);
        }
    });
</script>
</body>
</html>
