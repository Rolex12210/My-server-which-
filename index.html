<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>سينما الحب 🍿❤️ - بث مشترك مع دعم جوجل درايف</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #111; color: #fff; font-family: Arial, sans-serif; padding: 12px; direction: rtl; }
        .container { max-width: 500px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
        h1 { color: #e50914; font-size: 22px; margin: 5px 0; text-align: center; }
        .card { background: #1a1a1a; padding: 15px; border-radius: 12px; border: 1px solid #333; width: 100%; text-align: center; }
        input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #444; background: #222; color: white; margin-bottom: 10px; text-align: center; font-size: 14px; display: block; }
        button { padding: 12px 20px; background: #e50914; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 14px; margin: 5px auto; display: inline-block; }
        .btn-sec { background: #333; border: 1px solid #444; }
        .badge { display: inline-block; padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: bold; margin: 5px auto; }
        .room-title { font-size: 18px; color: #e50914; font-weight: bold; margin-bottom: 5px; }
        .status-card { background: #222; padding: 8px; border-radius: 8px; color: #4caf50; font-size: 14px; margin: 5px 0; font-weight: bold; }
        .video-wrapper { width: 100%; height: auto; aspect-ratio: 16 / 9; border-radius: 12px; box-shadow: 0 4px 20px rgba(229, 9, 20, 0.4); background: #000; overflow: hidden; display: none; position: relative; }
        video { width: 100%; height: 100%; display: none; background: #000; object-fit: contain; }
        .fullscreen-btn { display: none; background: #0288d1; color: white; padding: 14px 20px; font-size: 16px; border-radius: 10px; font-weight: bold; width: 100%; border: none; cursor: pointer; text-align: center; box-shadow: 0 4px 10px rgba(2, 136, 209, 0.3); }
        .fullscreen-btn:active { background: #01579b; }
        .chat-card { background: #151515; border: 1px solid #222; border-radius: 12px; text-align: right; padding: 12px; display: none; width: 100%; }
        .chat-box { height: 110px; overflow-y: auto; background: #000; border: 1px solid #333; border-radius: 8px; padding: 10px; margin-bottom: 10px; font-size: 13px; display: flex; flex-direction: column; }
        .msg { margin: 4px 0; padding: 6px 12px; border-radius: 8px; max-width: 75%; }
        .msg.me { background: #e50914; color: white; align-self: flex-start; border-bottom-right-radius: 0; }
        .msg.partner { background: #333; color: white; align-self: flex-end; border-bottom-left-radius: 0; }
        .chat-input-row { width: 100%; display: flex; gap: 8px; align-items: center; }
        .chat-input-row input { margin-bottom: 0; flex-grow: 1; text-align: right; }
        .chat-input-row button { margin: 0; padding: 12px 15px; width: auto; }
        .error-message { color: #ff6b6b; background-color: #2c1a1a; padding: 8px; border-radius: 8px; margin-top: 8px; font-size: 12px; text-align: center; }
    </style>
</head>
<body>
<div class="container">
    <h1>سينما الحب 🍿❤️</h1>
    <div id="usersBadge" class="badge" style="background:#333; display:none;">المتواجدون حالياً بالغرفة: <span id="countDisplay">1</span></div>

    <div class="card" id="setupCard">
        <div>
            <button id="adminBtn" style="background:#e50914;" onclick="setRole('ADMIN')">🎬 أنا المتحكم (مصطفى)</button>
            <button id="viewerBtn" class="btn-sec" onclick="setRole('VIEWER')">🍿 أنا المشاهد (نونة)</button>
        </div>
        <div id="adminAction"><button onclick="createNewRoom()">✨ إنشاء غرفة جديدة برقم قصير</button></div>
        <div id="viewerAction" style="display:none; margin-top:15px;">
            <input type="number" id="roomCodeInput" placeholder="🔢 ادخلي رقم الغرفة...">
            <button onclick="joinExistingRoom()">💕 دخول الغرفة والاتصال بمصطفى</button>
            <p id="joinStatus" style="font-size:13px; color:#aaa;"></p>
        </div>
    </div>

    <div class="card" id="broadcastCard" style="display:none;">
        <div class="room-title">🎥 رقم الغرفة: <span id="roomCodeDisplay">----</span></div>
        <div id="statusCard" class="status-card">🟢 النظام جاهز ومستقر تلقائياً</div>
        <div id="adminInputs">
            <input type="text" id="videoUrl" placeholder="🔗 ضع رابط قوقل درايف، فودو، أو m3u8 هنا...">
            <input type="text" id="subtitleUrl" placeholder="✍️ رابط الترجمة webvtt (اختياري)...">
            <button onclick="loadVideo()">▶️ بث الحلقة فوراً</button>
            <div id="adminError" class="error-message" style="display:none;"></div>
        </div>
        <div id="viewerInputs" style="display:none; color:#aaa;">💖 انتظري مصطفى ليقوم ببث الفيلم...</div>
    </div>

    <div class="video-wrapper" id="videoWrapper">
        <video id="videoPlayer" playsinline crossorigin="anonymous" controls>
            <track id="videoTrack" kind="subtitles" srclang="ar" label="العربية" default>
        </video>
    </div>

    <button id="customFullscreenBtn" class="fullscreen-btn" onclick="goFullscreen()">📺 وضع ملء الشاشة الكاملة</button>

    <div class="chat-card" id="chatCard">
        <div class="chat-box" id="chatBox"></div>
        <div class="chat-input-row">
            <input type="text" id="chatInput" placeholder="✍️ اكتب رسالة..." onkeypress="handleChatKey(event)">
            <button onclick="sendChatMessage()">📨</button>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCu62w7jzvxYvxPFdd65FbACIYohoXQ3Yk",
        authDomain: "cenama-9093f.firebaseapp.com",
        databaseURL: "https://cenama-9093f-default-rtdb.firebaseio.com",
        projectId: "cenama-9093f",
        storageBucket: "cenama-9093f.firebasestorage.app",
        messagingSenderId: "106569940197",
        appId: "1:106569940197:web:a5afbdb78e97eecc5f280c"
    };
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    const video = document.getElementById('videoPlayer');
    const videoWrapper = document.getElementById('videoWrapper');
    const videoTrack = document.getElementById('videoTrack');
    const countDisplay = document.getElementById('countDisplay');
    const chatBox = document.getElementById('chatBox');
    const chatInput = document.getElementById('chatInput');
    const joinStatus = document.getElementById('joinStatus');
    const roomCodeDisplay = document.getElementById('roomCodeDisplay');
    const adminError = document.getElementById('adminError');
    let myRole = 'ADMIN';
    let currentRoomCode = null;
    let isSyncing = false;
    let hls = null;

    function getGoogleDriveDirectLink(url) {
        const patterns = [
            /drive\.google\.com\/file\/d\/([^\/]+)\/view/,
            /drive\.google\.com\/open\?id=([^&]+)/,
            /drive\.google\.com\/uc\?id=([^&]+)/,
            /drive\.google\.com\/file\/d\/([^\/]+)/
        ];
        for (let p of patterns) {
            let m = url.match(p);
            if (m) return `https://drive.google.com/uc?id=${m[1]}&export=download`;
        }
        return null;
    }

    function isValidGoogleDriveUrl(url) {
        return /drive\.google\.com\/(file\/d\/|open\?id=|uc\?id=)/.test(url);
    }

    function smartPlay(url) {
        if (!url) return;
        video.style.display = 'block';
        if (hls) { hls.destroy(); hls = null; }
        let direct = getGoogleDriveDirectLink(url);
        let finalUrl = direct || url;
        if (finalUrl.includes('.m3u8')) {
            if (Hls.isSupported()) {
                hls = new Hls();
                hls.loadSource(finalUrl);
                hls.attachMedia(video);
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = finalUrl;
            } else {
                document.getElementById('statusCard').innerHTML = "❌ المتصفح لا يدعم HLS";
                return;
            }
        } else {
            video.src = finalUrl;
        }
        video.load();
        video.play().catch(e=>console.log("تشغيل تلقائي غير مسموح"));
        let msg = direct ? "🎬 تم تحويل رابط جوجل درايف وتشغيله" : (finalUrl.includes('.m3u8') ? "📡 بث HLS" : "🎥 تم تحميل الفيديو");
        document.getElementById('statusCard').innerHTML = msg;
    }

    function goFullscreen() {
        if (video.requestFullscreen) video.requestFullscreen();
        else if (video.webkitRequestFullscreen) video.webkitRequestFullscreen();
        else if (video.mozRequestFullScreen) video.mozRequestFullScreen();
        else if (video.msRequestFullscreen) video.msRequestFullscreen();
        else if (video.webkitEnterFullscreen) video.webkitEnterFullscreen();
        else alert("متصفحك لا يدعم ملء الشاشة");
    }

    function setRole(role) {
        myRole = role;
        document.getElementById('adminBtn').style.background = role === 'ADMIN' ? '#e50914' : '#333';
        document.getElementById('viewerBtn').style.background = role === 'VIEWER' ? '#e50914' : '#333';
        document.getElementById('adminAction').style.display = role === 'ADMIN' ? 'block' : 'none';
        document.getElementById('viewerAction').style.display = role === 'VIEWER' ? 'block' : 'none';
    }

    function showCinemaLayout(code) {
        document.getElementById('setupCard').style.display = 'none';
        document.getElementById('broadcastCard').style.display = 'block';
        roomCodeDisplay.textContent = code;
        document.getElementById('usersBadge').style.display = 'inline-block';
        videoWrapper.style.display = 'block';
        document.getElementById('chatCard').style.display = 'block';
        document.getElementById('customFullscreenBtn').style.display = 'block';
    }

    function createNewRoom() {
        currentRoomCode = Math.floor(1000 + Math.random() * 9000).toString();
        database.ref('rooms/' + currentRoomCode).set({ videoUrl: '', subtitleUrl: '', state: 'pause', currentTime: 0 });
        database.ref('rooms/' + currentRoomCode + '/viewerPresent').on('value', snap => {
            countDisplay.textContent = snap.val() ? '2' : '1';
        });
        database.ref('rooms/' + currentRoomCode + '/chat').on('child_added', snap => {
            if (snap.val().sender !== 'ADMIN') appendMessage(snap.val().text, 'partner');
        });
        showCinemaLayout(currentRoomCode);
    }

    function joinExistingRoom() {
        const code = document.getElementById('roomCodeInput').value.trim();
        if (!code) return alert('الرجاء إدخال رقم الغرفة!');
        joinStatus.textContent = 'جاري الاتصال...';
        database.ref('rooms/' + code).once('value', snap => {
            if (!snap.exists()) { joinStatus.textContent = '❌ الغرفة غير موجودة'; return; }
            currentRoomCode = code;
            database.ref('rooms/' + code + '/viewerPresent').set(true);
            database.ref('rooms/' + code + '/videoUrl').on('value', s => { if (s.val()) smartPlay(s.val()); });
            database.ref('rooms/' + code + '/subtitleUrl').on('value', s => {
                if (s.val() && video.style.display === 'block') {
                    videoTrack.src = s.val();
                    videoTrack.track.mode = "showing";
                }
            });
            database.ref('rooms/' + code + '/state').on('value', s => {
                if (isSyncing || myRole === 'ADMIN') return;
                isSyncing = true;
                if (s.val() === 'play') video.play().catch(()=>{});
                else video.pause();
                setTimeout(() => isSyncing = false, 200);
            });
            database.ref('rooms/' + code + '/chat').on('child_added', snap => {
                if (snap.val().sender !== 'VIEWER') appendMessage(snap.val().text, 'partner');
            });
            showCinemaLayout(code);
            document.getElementById('adminInputs').style.display = 'none';
            document.getElementById('viewerInputs').style.display = 'block';
            joinStatus.textContent = '✅ تم الانضمام بنجاح!';
        });
    }

    function loadVideo() {
        const url = document.getElementById('videoUrl').value.trim();
        const subUrl = document.getElementById('subtitleUrl').value.trim();
        adminError.style.display = 'none';
        if (!url) {
            adminError.innerText = 'الرجاء إدخال رابط الفيديو';
            adminError.style.display = 'block';
            setTimeout(()=>adminError.style.display='none',3000);
            return;
        }
        if (myRole === 'ADMIN' && currentRoomCode) {
            if (isValidGoogleDriveUrl(url) && !getGoogleDriveDirectLink(url)) {
                adminError.innerText = '⚠️ رابط جوجل درايف غير صالح أو الملف غير عام';
                adminError.style.display = 'block';
                setTimeout(()=>adminError.style.display='none',5000);
                return;
            }
            smartPlay(url);
            database.ref('rooms/' + currentRoomCode).update({ videoUrl: url, subtitleUrl: subUrl, state: 'pause', currentTime: 0 });
        }
    }

    video.addEventListener('play', () => {
        if (!isSyncing && myRole === 'ADMIN' && currentRoomCode) database.ref('rooms/' + currentRoomCode).update({ state: 'play' });
    });
    video.addEventListener('pause', () => {
        if (!isSyncing && myRole === 'ADMIN' && currentRoomCode) database.ref('rooms/' + currentRoomCode).update({ state: 'pause' });
    });

    function sendChatMessage() {
        const text = chatInput.value.trim();
        if (text && currentRoomCode) {
            database.ref('rooms/' + currentRoomCode + '/chat').push({ text, sender: myRole });
            appendMessage(text, 'me');
            chatInput.value = '';
        }
    }
    function handleChatKey(e) { if (e.key === 'Enter') sendChatMessage(); }
    function appendMessage(text, sender) {
        const d = document.createElement('div');
        d.className = `msg ${sender}`;
        d.textContent = text;
        chatBox.appendChild(d);
        chatBox.scrollTop = chatBox.scrollHeight;
    }
</script>
</body>
</html>
