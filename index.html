<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سينما الحب 🍿❤️</title>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <style>
        body { background-color: #111; color: #fff; font-family: Arial, sans-serif; text-align: center; padding: 20px; margin: 0; }
        .container { max-width: 800px; margin: 0 auto; }
        h1 { color: #e50914; font-size: 26px; margin-bottom: 5px; }
        video { width: 100%; border-radius: 12px; box-shadow: 0 4px 20px rgba(229, 9, 20, 0.5); background: #000; margin-top: 15px; display: none; }
        .card { background: #1a1a1a; padding: 20px; border-radius: 12px; border: 1px solid #333; margin-top: 15px; }
        input, select { width: 80%; padding: 12px; border-radius: 8px; border: 1px solid #444; background: #222; color: white; margin-bottom: 12px; text-align: center; font-size: 16px; }
        button { padding: 12px 24px; background: #e50914; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 15px; margin: 5px; }
        .btn-sec { background: #333; border: 1px solid #444; }
        .badge { display: inline-block; padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: bold; margin-top: 10px; }
        .room-title { font-size: 22px; color: #e50914; font-weight: bold; letter-spacing: 2px; }
        .users-count { background: #0277bd; color: white; padding: 4px 10px; border-radius: 10px; font-size: 12px; margin-left: 5px; }
        .role-section { margin-bottom: 15px; }
        .active-role { background: #e50914 !important; border-color: #e50914; }
        .chat-card { background: #151515; border: 1px solid #222; border-radius: 12px; margin-top: 20px; display: none; text-align: right; padding: 15px; }
        .chat-box { height: 150px; overflow-y: auto; background: #000; border: 1px solid #333; border-radius: 8px; padding: 10px; margin-bottom: 10px; font-size: 14px; display: flex; flex-direction: column; }
        .msg { margin: 4px 0; padding: 6px 12px; border-radius: 8px; max-width: 70%; word-wrap: break-word; line-height: 1.4; }
        .msg.me { background: #e50914; color: white; align-self: flex-start; border-bottom-right-radius: 0; }
        .msg.partner { background: #333; color: white; align-self: flex-end; border-bottom-left-radius: 0; }
        .chat-input-row { display: flex; gap: 10px; }
        .chat-input-row input { margin-bottom: 0; flex-grow: 1; text-align: right; }
        .chat-input-row button { margin: 0; padding: 10px 20px; }
        .timer-card { background: #222; padding: 10px; border-radius: 8px; color: #ff9800; font-size: 18px; margin: 10px 0; }
    </style>
</head>
<body>
<div class="container">
    <h1>سينما الحب 🍿❤️</h1>
    <div id="usersBadge" class="badge" style="background:#333; display:none;">
        المتواجدون حالياً بالغرفة: <span id="countDisplay" class="users-count">1</span>
    </div>

    <div class="card" id="setupCard">
        <div class="role-section">
            <button id="adminBtn" class="active-role" onclick="setRole('ADMIN')">أنا المتحكم (مصطفى)</button>
            <button id="viewerBtn" class="btn-sec" onclick="setRole('VIEWER')">أنا المشاهد (نونة)</button>
        </div>
        <div id="serverSelection" style="margin-top:15px;">
            <label>اختر خادم الإشارات:</label>
            <select id="signalServer" onchange="updateServer()">
                <option value="0.peerjs.com">الخادم الرئيسي (0.peerjs.com)</option>
                <option value="peer.ee">الخادم البديل (peer.ee)</option>
                <option value="peerjs-server.herokuapp.com">الخادم الاحتياطي 1</option>
                <option value="nru.herokuapp.com">الخادم الاحتياطي 2</option>
            </select>
        </div>
        <div id="adminAction">
            <button onclick="createNewRoom()">إنشاء غرفة جديدة برقم قصير</button>
        </div>
        <div id="viewerAction" style="display:none; margin-top: 15px;">
            <input type="number" id="roomCodeInput" placeholder="ادخلي رقم الغرفة المتكون من 4 أرقام...">
            <br>
            <button onclick="joinExistingRoom()">دخول الغرفة والاتصال بمصطفى</button>
            <p id="joinStatus" style="font-size:13px; color:#aaa;"></p>
        </div>
    </div>

    <div class="card" id="broadcastCard" style="display:none;">
        <div class="room-title" id="roomTitleDisplay">رقم الغرفة: ----</div>
        <div id="timerCard" class="timer-card" style="display:none;">
            ⏳ صلاحية الغرفة: <span id="timerDisplay">05:00</span>
        </div>
        <div id="adminInputs" style="margin-top: 15px;">
            <input type="text" id="videoUrl" placeholder="الزق رابط الفيلم المباشر هنا...">
            <br>
            <button onclick="loadVideo()">بث وتحديث الفيلم للطرفين</button>
        </div>
        <div id="viewerInputs" style="display:none; color: #aaa; margin-top:10px;">
            مرحباً نونة! مصطفى يقوم بالتحكم بالفيلم الآن، يرجى الانتظار.
        </div>
    </div>

    <video id="videoPlayer" playsinline></video>

    <div class="chat-card" id="chatCard">
        <div style="font-weight: bold; margin-bottom: 8px; color: #aaa; font-size: 14px;">دردشة الغرفة السريعة 💬</div>
        <div class="chat-box" id="chatBox"></div>
        <div class="chat-input-row">
            <input type="text" id="chatInput" placeholder="اكتب رسالة هنا..." onkeypress="handleChatKey(event)">
            <button onclick="sendChatMessage()">إرسال</button>
        </div>
    </div>
</div>

<script>
    // ========== خوادم الإشارات ==========
    const SIGNAL_SERVERS = {
        '0.peerjs.com': { host: '0.peerjs.com', port: 443, path: '/', secure: true },
        'peer.ee': { host: 'peer.ee', port: 443, path: '/', secure: true },
        'peerjs-server.herokuapp.com': { host: 'peerjs-server.herokuapp.com', port: 443, path: '/', secure: true },
        'nru.herokuapp.com': { host: 'nru.herokuapp.com', port: 443, path: '/', secure: true }
    };

    let currentSignalHost = '0.peerjs.com';

    function updateServer() {
        currentSignalHost = document.getElementById('signalServer').value;
    }

    function getPeerConfig(roomCode) {
        return {
            host: SIGNAL_SERVERS[currentSignalHost].host,
            port: SIGNAL_SERVERS[currentSignalHost].port,
            path: SIGNAL_SERVERS[currentSignalHost].path,
            secure: true,
            debug: 1,
            config: {
                iceServers: [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:stun1.l.google.com:19302' },
                    { urls: 'stun:stun2.l.google.com:19302' },
                    {
                        urls: 'turn:openrelay.metered.ca:443?transport=tcp',
                        username: 'openrelayproject',
                        credential: 'openrelayproject'
                    },
                    {
                        urls: 'turn:openrelay.metered.ca:80?transport=tcp',
                        username: 'openrelayproject',
                        credential: 'openrelayproject'
                    },
                    {
                        urls: 'turn:freeturn.net:3478?transport=udp',
                        username: 'free',
                        credential: 'free'
                    },
                    {
                        urls: 'turn:freeturn.net:3478?transport=tcp',
                        username: 'free',
                        credential: 'free'
                    }
                ]
            }
        };
    }

    const video = document.getElementById('videoPlayer');
    const statusBadge = document.getElementById('usersBadge');
    const countDisplay = document.getElementById('countDisplay');
    const chatCard = document.getElementById('chatCard');
    const chatBox = document.getElementById('chatBox');
    const chatInput = document.getElementById('chatInput');
    const joinStatus = document.getElementById('joinStatus');
    const timerCard = document.getElementById('timerCard');
    const timerDisplay = document.getElementById('timerDisplay');
    const roomTitleDisplay = document.getElementById('roomTitleDisplay');

    let peer = null;
    let conn = null;
    let myRole = 'ADMIN';
    let isSyncing = false;
    let currentRoomCode = null;
    let timerInterval = null;
    let roomExpired = false;
    const ROOM_TIMEOUT_SEC = 300;
    let remainingSeconds = ROOM_TIMEOUT_SEC;

    function setRole(role) {
        myRole = role;
        document.getElementById('adminBtn').className = role === 'ADMIN' ? 'active-role' : 'btn-sec';
        document.getElementById('viewerBtn').className = role === 'VIEWER' ? 'active-role' : 'btn-sec';
        document.getElementById('adminAction').style.display = role === 'ADMIN' ? 'block' : 'none';
        document.getElementById('viewerAction').style.display = role === 'VIEWER' ? 'block' : 'none';
    }

    function startExpiryTimer() {
        if (timerInterval) clearInterval(timerInterval);
        remainingSeconds = ROOM_TIMEOUT_SEC;
        roomExpired = false;
        timerCard.style.display = 'block';
        updateTimerDisplay();
        timerInterval = setInterval(() => {
            remainingSeconds--;
            updateTimerDisplay();
            if (remainingSeconds <= 0) {
                clearInterval(timerInterval);
                timerInterval = null;
                roomExpired = true;
                timerDisplay.textContent = "انتهت الصلاحية";
                timerCard.style.color = "#f44336";
                appendSystemMessage("⚠️ انتهت صلاحية الغرفة. أنشئ غرفة جديدة.");
            }
        }, 1000);
    }

    function updateTimerDisplay() {
        const mins = Math.floor(remainingSeconds / 60);
        const secs = remainingSeconds % 60;
        timerDisplay.textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    }

    function stopExpiryTimer() {
        if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
    }

    function createNewRoom() {
        stopExpiryTimer();
        if (peer && !peer.destroyed) peer.destroy();
        
        currentRoomCode = Math.floor(1000 + Math.random() * 9000).toString();
        roomExpired = false;

        peer = new Peer(currentRoomCode, getPeerConfig());

        peer.on('open', (id) => {
            console.log('🟢 الغرفة مفتوحة:', id);
            showCinemaLayout(id);
            video.controls = true;
            startHeartbeat(peer);
            startExpiryTimer();
        });

        peer.on('connection', (connection) => {
            if (roomExpired) {
                connection.close();
                return;
            }
            conn = connection;
            setupConnection();
        });

        peer.on('error', (err) => {
            console.error('🔴 خطأ:', err);
            if (err.type === 'unavailable-id') {
                createNewRoom();
            } else {
                alert("فشل الاتصال بالخادم. جرب خادم إشارات آخر من القائمة أعلاه.");
            }
        });
    }

    function joinExistingRoom() {
        const code = document.getElementById('roomCodeInput').value.trim();
        if (!code) return alert("الرجاء إدخال رقم الغرفة!");

        joinStatus.textContent = "جاري الاتصال...";
        joinStatus.style.color = "#ff9800";

        if (peer && !peer.destroyed) peer.destroy();

        peer = new Peer(getPeerConfig());
        peer.on('open', () => {
            startHeartbeat(peer);
            conn = peer.connect(code, { reliable: true });

            conn.on('open', () => {
                joinStatus.textContent = "";
                setupConnection();
                showCinemaLayout(code);
                document.getElementById('adminInputs').style.display = 'none';
                document.getElementById('viewerInputs').style.display = 'block';
                video.controls = false;
            });

            conn.on('error', () => {
                joinStatus.textContent = "الغرفة غير موجودة أو انتهت صلاحيتها.";
                joinStatus.style.color = "#f44336";
            });
        });

        peer.on('error', () => {
            joinStatus.textContent = "خطأ في الشبكة. تأكدي من الرابط https وجربي خادم إشارات آخر.";
            joinStatus.style.color = "#f44336";
        });
    }

    function showCinemaLayout(roomCode) {
        document.getElementById('setupCard').style.display = 'none';
        document.getElementById('broadcastCard').style.display = 'block';
        roomTitleDisplay.textContent = `رقم غرفتكم الحالي هو: ${roomCode}`;
        statusBadge.style.display = 'inline-block';
        countDisplay.innerText = "1";
        video.style.display = 'block';
        chatCard.style.display = 'block';
    }

    function setupConnection() {
        countDisplay.innerText = "2";
        countDisplay.style.background = "#2e7d32";
        appendSystemMessage("تم الاتصال بنجاح! السهرة بدأت 🎬❤️");

        conn.on('data', (data) => {
            if (data.type === 'CHAT') {
                appendMessage(data.text, 'partner');
            } else if (data.type === 'PING') {
                // نبض
            } else if (myRole === 'VIEWER') {
                isSyncing = true;
                if (data.type === 'PLAY') { video.currentTime = data.time; video.play(); }
                else if (data.type === 'PAUSE') { video.pause(); }
                else if (data.type === 'SEEK') { video.currentTime = data.time; }
                else if (data.type === 'LOAD') { video.src = data.url; video.load(); }
                setTimeout(() => { isSyncing = false; }, 200);
            }
        });

        conn.on('close', () => {
            countDisplay.innerText = "1";
            countDisplay.style.background = "#333";
            appendSystemMessage("انقطع اتصال الطرف الآخر 😢");
        });
    }

    function startHeartbeat(peerInstance) {
        if (window.heartbeatInterval) clearInterval(window.heartbeatInterval);
        window.heartbeatInterval = setInterval(() => {
            if (peerInstance && !peerInstance.destroyed) {
                try { peerInstance.socket.send({ type: 'PING' }); } catch(e) {}
            }
            if (conn && conn.open) {
                try { conn.send({ type: 'PING' }); } catch(e) {}
            }
        }, 8000);
    }

    function sendChatMessage() {
        const text = chatInput.value.trim();
        if (text) {
            if (conn && conn.open) conn.send({ type: 'CHAT', text: text });
            appendMessage(text, 'me');
            chatInput.value = '';
        }
    }

    function handleChatKey(e) { if (e.key === 'Enter') sendChatMessage(); }

    function appendMessage(text, sender) {
        const div = document.createElement('div');
        div.className = `msg ${sender}`;
        div.innerText = text;
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function appendSystemMessage(text) {
        const div = document.createElement('div');
        div.style.color = "#4caf50";
        div.style.fontSize = "12px";
        div.style.textAlign = "center";
        div.style.margin = "5px 0";
        div.innerText = text;
        chatBox.appendChild(div);
    }

    video.addEventListener('play', () => {
        if (!isSyncing && conn && conn.open && myRole === 'ADMIN')
            conn.send({ type: 'PLAY', time: video.currentTime });
    });
    video.addEventListener('pause', () => {
        if (!isSyncing && conn && conn.open && myRole === 'ADMIN')
            conn.send({ type: 'PAUSE' });
    });
    video.addEventListener('seeked', () => {
        if (!isSyncing && conn && conn.open && myRole === 'ADMIN')
            conn.send({ type: 'SEEK', time: video.currentTime });
    });

    function loadVideo() {
        const url = document.getElementById('videoUrl').value;
        if (url && myRole === 'ADMIN') {
            video.src = url; video.load();
            if (conn && conn.open) conn.send({ type: 'LOAD', url: url });
        }
    }
</script>
</body>
</html>
