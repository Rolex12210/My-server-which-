<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سينما الحب 🍿❤️</title>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <style>
        body {
            background-color: #111;
            color: #fff;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        h1 { color: #e50914; font-size: 26px; margin-bottom: 10px; }
        video {
            width: 100%;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(229, 9, 20, 0.4);
            background: #000;
            margin-top: 15px;
        }
        .controls-box {
            margin-top: 15px;
            background: #222;
            padding: 15px;
            border-radius: 8px;
        }
        input {
            width: 85%;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #444;
            background: #333;
            color: white;
            margin-bottom: 10px;
            font-size: 14px;
        }
        button {
            padding: 10px 20px;
            background: #e50914;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            margin: 5px;
        }
        .btn-secondary { background: #444; }
        .status-badge {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            background: #333;
            margin-top: 10px;
        }
        .room-section {
            background: #1a1a1a;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
            border: 1px dashed #444;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>سينما الحب 🍿❤️</h1>
    
    <div class="room-section">
        <div id="myIdDisplay">جاري إنشاء الغرفة...</div>
        <div style="margin-top: 8px;">
            <input type="text" id="peerIdInput" placeholder="ادخل معرف غرفة حبيبتك هنا للاتصال..." style="width: 70%; margin-bottom: 0; padding: 8px;">
            <button onclick="connectToPeer()" style="padding: 8px 15px;">اتصال</button>
        </div>
    </div>

    <video id="videoPlayer" controls playsinline></video>

    <div class="controls-box">
        <input type="text" id="videoUrl" placeholder="الزق رابط الفيلم المباشر هنا (mp4)...">
        <br>
        <button onclick="loadVideo()">تحديث الفيلم للطرفين</button>
        <br>
        <div class="status-badge" id="status">جاري تشغيل النظام اللحظي...</div>
    </div>
</div>

<script>
    const video = document.getElementById('videoPlayer');
    const statusBadge = document.getElementById('status');
    const myIdDisplay = document.getElementById('myIdDisplay');
    
    // إنشاء اتصال Peer مجاني وعشوائي
    const peer = new Peer();
    let conn = null;
    let isSyncing = false;

    // عند فتح الغرفة وتوليد المعرف الخاص بك
    peer.on('open', (id) => {
        myIdDisplay.innerHTML = `معرف غرفتك الحالي: <b style="color:#e50914; user-select:all;">${id}</b> (اضغط مطولاً للنسخ وأرسله لها)`;
        statusBadge.innerText = "جاهز للاتصال المباشر 🔗";
        statusBadge.style.color = "#4caf50";
    });

    // استقبال الاتصال من الطرف الآخر (حبيبتك)
    peer.on('connection', (connection) => {
        conn = connection;
        setupConnection();
    });

    // دالة للاتصال بغرفة الطرف الآخر
    function connectToPeer() {
        const peerId = document.getElementById('peerIdInput').value;
        if (peerId) {
            statusBadge.innerText = "جاري الاتصال... ⏳";
            conn = peer.connect(peerId);
            setupConnection();
        }
    }

    // إعداد قنوات استقبال وإرسال الأحداث اللحظية
    function setupConnection() {
        statusBadge.innerText = "متصلون الآن! مشاهدة ممتعة ❤️";
        statusBadge.style.color = "#4caf50";

        conn.on('data', (data) => {
            isSyncing = true;
            if (data.type === 'PLAY') {
                video.currentTime = data.time;
                video.play();
            } else if (data.type === 'PAUSE') {
                video.pause();
            } else if (data.type === 'SEEK') {
                video.currentTime = data.time;
            } else if (data.type === 'LOAD') {
                video.src = data.url;
                video.load();
            }
            setTimeout(() => { isSyncing = false; }, 200);
        });
    }

    // إرسال الأحداث عند التحكم بالفيديو من قبلك
    video.addEventListener('play', () => {
        if (!isSyncing && conn) conn.send({ type: 'PLAY', time: video.currentTime });
    });

    video.addEventListener('pause', () => {
        if (!isSyncing && conn) conn.send({ type: 'PAUSE' });
    });

    video.addEventListener('seeking', () => {
        if (!isSyncing && conn) conn.send({ type: 'SEEK', time: video.currentTime });
    });

    function loadVideo() {
        const url = document.getElementById('videoUrl').value;
        if (url) {
            video.src = url;
            video.load();
            if (conn) conn.send({ type: 'LOAD', url: url });
        }
    }
</script>

</body>
</html>
