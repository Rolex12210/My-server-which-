<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>سينما الحب 🍿❤️ - مشغل فيديو احترافي</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(145deg, #0a0a0a 0%, #1a1a1a 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: #e50914;
            font-size: 2.2rem;
            margin-bottom: 20px;
            text-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }
        /* كروت الإعدادات */
        .cards-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 30px;
        }
        .card {
            background: rgba(30,30,40,0.9);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px;
            flex: 1;
            min-width: 250px;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }
        .card h3 {
            color: #e50914;
            margin-bottom: 15px;
        }
        button, .button-like {
            background: #e50914;
            border: none;
            color: white;
            padding: 10px 20px;
            border-radius: 40px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 14px;
            margin: 5px;
            display: inline-block;
        }
        button:hover {
            transform: scale(1.02);
            background: #f81d2a;
        }
        .btn-secondary {
            background: #333;
        }
        input, textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            border-radius: 30px;
            border: none;
            background: #2a2a2a;
            color: white;
            font-size: 14px;
            text-align: center;
        }
        /* مشغل الفيديو المخصص */
        .video-container {
            background: #000;
            border-radius: 24px;
            overflow: hidden;
            margin: 20px 0;
            box-shadow: 0 20px 35px rgba(229,9,20,0.2);
            position: relative;
        }
        video {
            width: 100%;
            height: auto;
            display: block;
            background: black;
            cursor: pointer;
        }
        /* أزرار تحكم إضافية */
        .video-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            background: #111;
            border-radius: 0 0 20px 20px;
            gap: 10px;
            flex-wrap: wrap;
        }
        .ctrl-btn {
            background: #e50914;
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: 40px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
        }
        .ctrl-btn.secondary {
            background: #2c2c2c;
        }
        .status {
            background: #222;
            padding: 8px 15px;
            border-radius: 40px;
            font-size: 13px;
            color: #4caf50;
        }
        /* الشات */
        .chat-container {
            background: #1e1e2a;
            border-radius: 24px;
            padding: 15px;
            margin-top: 20px;
        }
        .chat-box {
            height: 200px;
            overflow-y: auto;
            background: #0a0a0a;
            border-radius: 16px;
            padding: 10px;
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .msg {
            max-width: 80%;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 14px;
            word-break: break-word;
        }
        .msg.me {
            background: #e50914;
            align-self: flex-start;
            border-bottom-left-radius: 5px;
        }
        .msg.partner {
            background: #2c2c2c;
            align-self: flex-end;
            border-bottom-right-radius: 5px;
        }
        .chat-input {
            display: flex;
            gap: 10px;
        }
        .chat-input input {
            margin: 0;
            flex: 1;
        }
        .badge {
            display: inline-block;
            background: #333;
            border-radius: 30px;
            padding: 6px 14px;
            font-size: 13px;
            margin-bottom: 15px;
        }
        @media (max-width: 700px) {
            .cards-grid { flex-direction: column; }
            .video-controls { flex-direction: column; }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>🎬 سينما الحب | مشغل سحري 🍿</h1>

    <div id="roomSetup" class="cards-grid">
        <div class="card">
            <h3>👨‍💼 التحكم (مصطفى)</h3>
            <button id="adminModeBtn" onclick="setRole('ADMIN')">🎬 أنا المصدر</button>
            <div id="adminPanel">
                <button onclick="createRoom()">✨ إنشاء غرفة جديدة</button>
            </div>
        </div>
        <div class="card">
            <h3>👩‍❤️‍👨 المشاهدة (نونة)</h3>
            <button id="viewerModeBtn" onclick="setRole('VIEWER')">🍿 أنا المشاهد</button>
            <div id="viewerPanel" style="display:none;">
                <input type="text" id="roomCodeJoin" placeholder="🔢 رقم الغرفة">
                <button onclick="joinRoom()">💕 دخول الغرفة</button>
                <p id="joinMsg" style="font-size:13px;"></p>
            </div>
        </div>
    </div>

    <div id="roomInfo" style="display:none;">
        <div class="badge">🎥 رقم الغرفة: <strong id="roomCodeSpan">----</strong></div>
        <div class="badge">👥 المتصلون: <span id="userCount">1</span></div>
    </div>

    <!-- مشغل الفيديو المخصص -->
    <div class="video-container" id="videoContainer" style="display:none;">
        <video id="mainVideo" controls playsinline crossorigin="anonymous">
            <track id="subtitleTrack" kind="subtitles" srclang="ar" label="العربية">
        </video>
        <div class="video-controls">
            <div class="status" id="videoStatus">⚡ جاهز للتشغيل</div>
            <button id="fullscreenBtn" class="ctrl-btn">📺 ملء الشاشة</button>
        </div>
    </div>

    <!-- حقل إدخال الرابط للمصدر -->
    <div id="adminControls" style="display:none; background:#1e1e2a; border-radius:24px; padding:20px; margin:15px 0;">
        <input type="text" id="videoLinkInput" placeholder="🔗 رابط الفيديو (Google Drive, mp4, m3u8, ...)">
        <input type="text" id="subtitleLinkInput" placeholder="✍️ رابط الترجمة (WebVTT) - اختياري">
        <button onclick="loadVideoByAdmin()">▶️ بث الحلقة الآن</button>
        <div id="adminFeedback" style="font-size:13px; color:#ffaa00; margin-top:10px;"></div>
    </div>

    <div id="viewerWaiting" style="display:none; background:#1e1e2a; border-radius:24px; padding:20px; text-align:center;">
        💖 في انتظار أن يقوم مصطفى ببث الفيلم...
    </div>

    <!-- الشات -->
    <div class="chat-container" id="chatPanel" style="display:none;">
        <h3>💬 دردشة الغرفة</h3>
        <div class="chat-box" id="chatMessages"></div>
        <div class="chat-input">
            <input type="text" id="chatInput" placeholder="اكتب رسالة..." onkeypress="if(event.key==='Enter') sendMsg()">
            <button onclick="sendMsg()">📨 إرسال</button>
        </div>
    </div>
</div>

<script>
    // --------------------- إعداد Firebase ---------------------
    const firebaseConfig = {
        apiKey: "AIzaSyCu62w7jzvxYvxPFdd65FbACIYohoXQ3Yk",
        authDomain: "cenama-9093f.firebaseapp.com",
        databaseURL: "https://cenama-9093f-default-rtdb.firebaseio.com",
        projectId: "cenama-9093f",
        storageBucket: "cenama-9093f.firebasestorage.app",
        messagingSenderId: "106569940197",
        appId: "1:106569940197:web:a5afbdb78e97eecc5f280c"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // --------------------- عناصر DOM ---------------------
    const video = document.getElementById('mainVideo');
    const subtitleTrack = document.getElementById('subtitleTrack');
    const videoContainer = document.getElementById('videoContainer');
    const adminControls = document.getElementById('adminControls');
    const viewerWaiting = document.getElementById('viewerWaiting');
    const chatPanel = document.getElementById('chatPanel');
    const roomInfoDiv = document.getElementById('roomInfo');
    const roomCodeSpan = document.getElementById('roomCodeSpan');
    const userCountSpan = document.getElementById('userCount');
    const videoStatus = document.getElementById('videoStatus');
    const adminFeedback = document.getElementById('adminFeedback');

    let myRole = null;         // 'ADMIN' or 'VIEWER'
    let currentRoom = null;
    let hls = null;            // for m3u8
    let isSyncing = false;     // to avoid feedback loops

    // --------------------- تحويل رابط جوجل درايف إلى رابط مباشر -----------------
    function getGoogleDriveDirectLink(url) {
        // أنماط الروابط المدعومة
        const patterns = [
            /drive\.google\.com\/file\/d\/([^\/]+)\/view/,
            /drive\.google\.com\/open\?id=([^&]+)/,
            /drive\.google\.com\/uc\?id=([^&]+)/,
            /drive\.google\.com\/file\/d\/([^\/]+)/
        ];
        for (let p of patterns) {
            let match = url.match(p);
            if (match) {
                let fileId = match[1];
                // أفضل رابط مباشر للتشغيل بدون تنزيل
                return `https://drive.usercontent.google.com/download?id=${fileId}&export=download&authuser=0`;
                // يمكن أيضاً استخدام: `https://drive.google.com/uc?export=download&id=${fileId}`
            }
        }
        return null;
    }

    // --------------------- التشغيل الذكي لأي رابط -----------------
    function smartPlay(url, subtitleUrl = null) {
        if (!url) return;
        // تنظيف أي HLS سابق
        if (hls) {
            hls.destroy();
            hls = null;
        }
        // تحويل رابط جوجل درايف إن وجد
        let directUrl = getGoogleDriveDirectLink(url);
        let finalUrl = directUrl || url;
        
        // التحقق من صيغة m3u8
        if (finalUrl.includes('.m3u8') || finalUrl.includes('m3u8')) {
            if (Hls.isSupported()) {
                hls = new Hls();
                hls.loadSource(finalUrl);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, () => {
                    video.play().catch(e => console.log("auto-play blocked"));
                    videoStatus.innerText = "📡 بث HLS مباشر";
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = finalUrl;
                videoStatus.innerText = "📡 بث HLS (Safari)";
            } else {
                videoStatus.innerText = "❌ HLS غير مدعوم";
                return;
            }
        } else {
            // فيديو عادي (mp4, webm, أو رابط مباشر)
            video.src = finalUrl;
            video.load();
            video.play().catch(e => console.log("auto-play not allowed"));
            videoStatus.innerText = directUrl ? "🎬 فيديو من جوجل درايف" : "🎥 فيديو مباشر";
        }
        
        // إضافة الترجمة إذا وجدت
        if (subtitleUrl) {
            subtitleTrack.src = subtitleUrl;
            subtitleTrack.track.mode = "showing";
        } else {
            subtitleTrack.src = "";
        }
    }

    // --------------------- ملء الشاشة (ثابت على جميع الأجهزة) -----------------
    function goFullscreen() {
        try {
            if (video.requestFullscreen) video.requestFullscreen();
            else if (video.webkitRequestFullscreen) video.webkitRequestFullscreen();
            else if (video.mozRequestFullScreen) video.mozRequestFullScreen();
            else if (video.msRequestFullscreen) video.msRequestFullscreen();
            else if (video.webkitEnterFullscreen) video.webkitEnterFullscreen(); // iOS
            else alert("المتصفح لا يدعم ملء الشاشة");
        } catch(e) {
            alert("حدث خطأ: "+e.message);
        }
    }
    document.getElementById('fullscreenBtn').addEventListener('click', goFullscreen);

    // --------------------- مزامنة حالة التشغيل مع قاعدة البيانات -----------------
    video.addEventListener('play', () => {
        if (!isSyncing && myRole === 'ADMIN' && currentRoom) {
            db.ref(`rooms/${currentRoom}/state`).set('play');
        }
    });
    video.addEventListener('pause', () => {
        if (!isSyncing && myRole === 'ADMIN' && currentRoom) {
            db.ref(`rooms/${currentRoom}/state`).set('pause');
        }
    });
    // عند تغيير الوقت (اختياري للمزامنة الدقيقة)
    video.addEventListener('timeupdate', () => {
        if (!isSyncing && myRole === 'ADMIN' && currentRoom && Math.random() < 0.05) { // تحديث كل 5% تقريباً لتقليل الضغط
            db.ref(`rooms/${currentRoom}/currentTime`).set(video.currentTime);
        }
    });

    // --------------------- دوال الأدوار -----------------
    function setRole(role) {
        myRole = role;
        document.getElementById('adminModeBtn').style.background = role === 'ADMIN' ? '#e50914' : '#333';
        document.getElementById('viewerModeBtn').style.background = role === 'VIEWER' ? '#e50914' : '#333';
        document.getElementById('adminPanel').style.display = role === 'ADMIN' ? 'block' : 'none';
        document.getElementById('viewerPanel').style.display = role === 'VIEWER' ? 'block' : 'none';
    }

    // إنشاء غرفة جديدة (المصدر)
    function createRoom() {
        currentRoom = Math.floor(1000 + Math.random() * 9000).toString();
        db.ref(`rooms/${currentRoom}`).set({
            videoUrl: '',
            subtitleUrl: '',
            state: 'pause',
            currentTime: 0
        });
        db.ref(`rooms/${currentRoom}/viewerPresent`).set(false);
        // مراقبة عدد المشاهدين
        db.ref(`rooms/${currentRoom}/viewerPresent`).on('value', snap => {
            userCountSpan.innerText = snap.val() ? '2' : '1';
        });
        // مراقبة الشات
        db.ref(`rooms/${currentRoom}/chat`).on('child_added', snap => {
            if (snap.val().sender !== 'ADMIN') addMessage(snap.val().text, 'partner');
        });
        startCinemaMode(currentRoom);
        // إظهار عناصر التحكم للمصدر
        adminControls.style.display = 'block';
        viewerWaiting.style.display = 'none';
    }

    // الانضمام إلى غرفة (المشاهد)
    function joinRoom() {
        const code = document.getElementById('roomCodeJoin').value.trim();
        if (!code) return alert('أدخل رقم الغرفة');
        currentRoom = code;
        db.ref(`rooms/${code}`).once('value', snap => {
            if (!snap.exists()) {
                document.getElementById('joinMsg').innerText = '❌ الغرفة غير موجودة';
                return;
            }
            document.getElementById('joinMsg').innerText = '✅ تم الاتصال';
            // إعلام بوجود مشاهد
            db.ref(`rooms/${code}/viewerPresent`).set(true);
            // الاستماع للفيديو
            db.ref(`rooms/${code}/videoUrl`).on('value', s => {
                if (s.val()) {
                    let subUrl = null;
                    db.ref(`rooms/${code}/subtitleUrl`).once('value', sub => { subUrl = sub.val(); });
                    smartPlay(s.val(), subUrl);
                }
            });
            db.ref(`rooms/${code}/subtitleUrl`).on('value', s => {
                if (s.val()) {
                    subtitleTrack.src = s.val();
                    subtitleTrack.track.mode = "showing";
                }
            });
            // مزامنة الحالة (تشغيل/إيقاف)
            db.ref(`rooms/${code}/state`).on('value', s => {
                if (isSyncing || myRole === 'ADMIN') return;
                isSyncing = true;
                if (s.val() === 'play') video.play().catch(e=>console.log);
                else video.pause();
                setTimeout(() => isSyncing = false, 300);
            });
            // مزامنة الوقت
            db.ref(`rooms/${code}/currentTime`).on('value', t => {
                if (!isSyncing && myRole !== 'ADMIN' && t.val() && Math.abs(video.currentTime - t.val()) > 1) {
                    isSyncing = true;
                    video.currentTime = t.val();
                    setTimeout(() => isSyncing = false, 300);
                }
            });
            // الشات
            db.ref(`rooms/${code}/chat`).on('child_added', snap => {
                if (snap.val().sender !== 'VIEWER') addMessage(snap.val().text, 'partner');
            });
            startCinemaMode(code);
            adminControls.style.display = 'none';
            viewerWaiting.style.display = 'block';
        });
    }

    // بدء وضع السينما (إظهار العناصر المشتركة)
    function startCinemaMode(roomCode) {
        document.getElementById('roomSetup').style.display = 'none';
        roomInfoDiv.style.display = 'block';
        roomCodeSpan.innerText = roomCode;
        videoContainer.style.display = 'block';
        chatPanel.style.display = 'block';
    }

    // تحميل الفيديو من قبل المصدر
    function loadVideoByAdmin() {
        if (myRole !== 'ADMIN' || !currentRoom) return;
        const videoUrl = document.getElementById('videoLinkInput').value.trim();
        const subUrl = document.getElementById('subtitleLinkInput').value.trim();
        if (!videoUrl) {
            adminFeedback.innerText = '⚠️ الرجاء إدخال رابط الفيديو';
            return;
        }
        // معاينة مباشرة للمصدر
        smartPlay(videoUrl, subUrl);
        // حفظ في قاعدة البيانات ليتم بثه للمشاهد
        db.ref(`rooms/${currentRoom}`).update({
            videoUrl: videoUrl,
            subtitleUrl: subUrl,
            state: 'pause',
            currentTime: 0
        });
        adminFeedback.innerText = '✅ تم بث الفيديو بنجاح!';
        setTimeout(() => adminFeedback.innerText = '', 3000);
    }

    // دوال الشات
    function sendMsg() {
        const txt = document.getElementById('chatInput').value.trim();
        if (txt && currentRoom) {
            db.ref(`rooms/${currentRoom}/chat`).push({ text: txt, sender: myRole });
            addMessage(txt, 'me');
            document.getElementById('chatInput').value = '';
        }
    }
    function addMessage(text, type) {
        const msgDiv = document.createElement('div');
        msgDiv.className = `msg ${type === 'me' ? 'me' : 'partner'}`;
        msgDiv.innerText = text;
        document.getElementById('chatMessages').appendChild(msgDiv);
        msgDiv.scrollIntoView({ behavior: 'smooth' });
    }
    window.sendMsg = sendMsg;
    window.setRole = setRole;
    window.createRoom = createRoom;
    window.joinRoom = joinRoom;
    window.loadVideoByAdmin = loadVideoByAdmin;
</script>
</body>
</html>
