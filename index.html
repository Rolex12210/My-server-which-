<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سينما الحب 🍿 - النسخة المستقرة</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #0a0a0a; color: white; font-family: Arial; padding: 15px; }
        .container { max-width: 800px; margin: auto; }
        .card { background: #1e1e2a; border-radius: 20px; padding: 20px; margin-bottom: 20px; }
        button, input { padding: 10px; border-radius: 30px; border: none; margin: 5px; }
        button { background: #e50914; color: white; cursor: pointer; font-weight: bold; }
        input { background: #2a2a2a; color: white; width: calc(100% - 20px); }
        iframe, video { width: 100%; height: 400px; border-radius: 16px; background: black; display: none; }
        .status { font-size: 13px; color: #4caf50; margin: 10px 0; }
        .chat-box { height: 180px; overflow-y: auto; background: #111; border-radius: 16px; padding: 10px; margin: 10px 0; }
        .msg { padding: 8px 12px; border-radius: 20px; margin: 5px; max-width: 70%; }
        .msg.me { background: #e50914; align-self: flex-start; }
        .msg.partner { background: #333; align-self: flex-end; text-align: right; }
        .flex { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    </style>
</head>
<body>
<div class="container">
    <h1 style="color:#e50914; text-align:center;">سينما الحب 🎬❤️</h1>

    <div class="card" id="roleCard">
        <div class="flex">
            <button id="btnAdmin" onclick="setRole('admin')">🎬 أنا المصدر (مصطفى)</button>
            <button id="btnViewer" onclick="setRole('viewer')">🍿 أنا المشاهد (نونة)</button>
        </div>
        <div id="adminCreateDiv">
            <button onclick="createRoom()">✨ إنشاء غرفة جديدة</button>
        </div>
        <div id="viewerJoinDiv" style="display:none;">
            <input type="text" id="roomCodeInput" placeholder="🔢 رقم الغرفة">
            <button onclick="joinRoom()">💕 دخول الغرفة</button>
            <div id="joinError"></div>
        </div>
    </div>

    <div id="roomInfo" style="display:none;" class="card">
        <div>🎥 رقم الغرفة: <strong id="roomCodeSpan"></strong> | 👥 المتصلون: <span id="userCount">1</span></div>
    </div>

    <div id="videoContainer" class="card" style="display:none;">
        <iframe id="driveFrame" allowfullscreen></iframe>
        <video id="normalVideo" controls style="display:none;"></video>
        <div class="flex" style="justify-content:center; margin-top:10px;">
            <button id="fullscreenBtn" onclick="goFullscreen()">📺 ملء الشاشة</button>
        </div>
        <div id="videoStatus" class="status"></div>
    </div>

    <div id="adminControls" class="card" style="display:none;">
        <input type="text" id="videoUrlInput" placeholder="🔗 رابط الفيديو (Google Drive أو mp4 أو m3u8)">
        <button onclick="publishVideo()">▶️ بث الحلقة الآن</button>
        <div id="publishStatus"></div>
    </div>

    <div id="viewerWait" class="card" style="display:none; text-align:center;">
        💖 في انتظار بدء البث...
    </div>

    <div id="chatSection" class="card" style="display:none;">
        <div class="chat-box" id="chatMessages"></div>
        <div class="flex">
            <input type="text" id="chatInput" placeholder="اكتب رسالة..." onkeypress="if(event.key==='Enter') sendMsg()">
            <button onclick="sendMsg()">📨</button>
        </div>
    </div>
</div>

<script>
    // Firebase
    const firebaseConfig = {
        apiKey: "AIzaSyCu62w7jzvxYvxPFdd65FbACIYohoXQ3Yk",
        authDomain: "cenama-9093f.firebaseapp.com",
        databaseURL: "https://cenama-9093f-default-rtdb.firebaseio.com",
        projectId: "cenama-9093f",
        storageBucket: "cenama-9093f.firebasestorage.app",
        messagingSenderId: "106569940197",
        appId: "1:106569940197:web:a5afbdb78e97eecc5f280c"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // العناصر
    const driveFrame = document.getElementById('driveFrame');
    const normalVideo = document.getElementById('normalVideo');
    const videoContainer = document.getElementById('videoContainer');
    const adminControls = document.getElementById('adminControls');
    const viewerWait = document.getElementById('viewerWait');
    const chatSection = document.getElementById('chatSection');
    const roomInfo = document.getElementById('roomInfo');

    let myRole = null; // 'admin' or 'viewer'
    let currentRoom = null;
    let isSyncing = false;

    // دالة استخراج رابط iframe من جوجل درايف
    function getDriveEmbedUrl(url) {
        let match = url.match(/\/file\/d\/([^\/]+)/);
        if (match) return `https://drive.google.com/file/d/${match[1]}/preview`;
        match = url.match(/id=([^&]+)/);
        if (match) return `https://drive.google.com/file/d/${match[1]}/preview`;
        return null;
    }

    // تشغيل الفيديو (تحديد iframe أو video)
    function displayVideo(url) {
        driveFrame.style.display = 'none';
        normalVideo.style.display = 'none';
        let embed = getDriveEmbedUrl(url);
        if (embed) {
            driveFrame.src = embed;
            driveFrame.style.display = 'block';
            document.getElementById('videoStatus').innerText = '🎬 فيديو جوجل درايف يعمل الآن';
            return true;
        } else {
            normalVideo.src = url;
            normalVideo.style.display = 'block';
            document.getElementById('videoStatus').innerText = '🎥 فيديو عادي';
            return true;
        }
    }

    // ملء الشاشة
    function goFullscreen() {
        let elem = driveFrame.style.display === 'block' ? driveFrame : normalVideo;
        if (elem.requestFullscreen) elem.requestFullscreen();
        else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();
        else if (elem.mozRequestFullScreen) elem.mozRequestFullScreen();
        else if (elem.msRequestFullscreen) elem.msRequestFullscreen();
        else alert("المتصفح لا يدعم ملء الشاشة");
    }

    // إظهار واجهة السينما بعد إنشاء/دخول الغرفة
    function enterCinemaMode(roomCode) {
        document.getElementById('roleCard').style.display = 'none';
        roomInfo.style.display = 'block';
        videoContainer.style.display = 'block';
        chatSection.style.display = 'block';
        document.getElementById('roomCodeSpan').innerText = roomCode;
    }

    // إنشاء غرفة (مصدر)
    function createRoom() {
        currentRoom = Math.floor(1000 + Math.random() * 9000).toString();
        db.ref(`rooms/${currentRoom}`).set({ videoUrl: '', state: 'pause' });
        db.ref(`rooms/${currentRoom}/viewerPresent`).set(false);
        db.ref(`rooms/${currentRoom}/viewerPresent`).on('value', snap => {
            document.getElementById('userCount').innerText = snap.val() ? '2' : '1';
        });
        db.ref(`rooms/${currentRoom}/chat`).on('child_added', snap => {
            if (snap.val().sender !== 'admin') addMessage(snap.val().text, 'partner');
        });
        enterCinemaMode(currentRoom);
        adminControls.style.display = 'block';
        viewerWait.style.display = 'none';
        // تنظيف
        document.getElementById('publishStatus').innerText = '';
    }

    // انضمام مشاهد
    function joinRoom() {
        let code = document.getElementById('roomCodeInput').value.trim();
        if (!code) { document.getElementById('joinError').innerText = 'أدخل رقم الغرفة'; return; }
        currentRoom = code;
        db.ref(`rooms/${code}`).once('value', snap => {
            if (!snap.exists()) {
                document.getElementById('joinError').innerText = '❌ الغرفة غير موجودة';
                return;
            }
            db.ref(`rooms/${code}/viewerPresent`).set(true);
            // استماع للفيديو
            db.ref(`rooms/${code}/videoUrl`).on('value', s => {
                if (s.val()) displayVideo(s.val());
            });
            // مزامنة الحالة (تشغيل/إيقاف للفيديو العادي فقط)
            db.ref(`rooms/${code}/state`).on('value', s => {
                if (isSyncing) return;
                isSyncing = true;
                if (normalVideo.style.display === 'block') {
                    if (s.val() === 'play') normalVideo.play();
                    else normalVideo.pause();
                }
                setTimeout(() => isSyncing = false, 200);
            });
            db.ref(`rooms/${code}/chat`).on('child_added', snap => {
                if (snap.val().sender !== 'viewer') addMessage(snap.val().text, 'partner');
            });
            enterCinemaMode(code);
            adminControls.style.display = 'none';
            viewerWait.style.display = 'block';
            document.getElementById('joinError').innerText = '';
        });
    }

    // نشر الفيديو من المصدر
    function publishVideo() {
        if (myRole !== 'admin' || !currentRoom) return;
        let url = document.getElementById('videoUrlInput').value.trim();
        if (!url) {
            document.getElementById('publishStatus').innerText = '⚠️ الرجاء إدخال رابط';
            return;
        }
        // معاينة للمصدر
        displayVideo(url);
        // حفظ في قاعدة البيانات
        db.ref(`rooms/${currentRoom}`).update({ videoUrl: url, state: 'play' });
        document.getElementById('publishStatus').innerText = '✅ تم بث الفيديو بنجاح';
        setTimeout(() => document.getElementById('publishStatus').innerText = '', 3000);
    }

    // أحداث الفيديو للمزامنة (للوسائط العادية)
    normalVideo.addEventListener('play', () => {
        if (!isSyncing && myRole === 'admin' && currentRoom) db.ref(`rooms/${currentRoom}/state`).set('play');
    });
    normalVideo.addEventListener('pause', () => {
        if (!isSyncing && myRole === 'admin' && currentRoom) db.ref(`rooms/${currentRoom}/state`).set('pause');
    });

    // الشات
    function sendMsg() {
        let txt = document.getElementById('chatInput').value.trim();
        if (txt && currentRoom) {
            db.ref(`rooms/${currentRoom}/chat`).push({ text: txt, sender: myRole });
            addMessage(txt, 'me');
            document.getElementById('chatInput').value = '';
        }
    }
    function addMessage(txt, type) {
        let div = document.createElement('div');
        div.className = `msg ${type === 'me' ? 'me' : 'partner'}`;
        div.innerText = txt;
        document.getElementById('chatMessages').appendChild(div);
        div.scrollIntoView({ behavior: 'smooth' });
    }

    // تبديل الدور
    function setRole(role) {
        myRole = role;
        document.getElementById('btnAdmin').style.background = role === 'admin' ? '#e50914' : '#333';
        document.getElementById('btnViewer').style.background = role === 'viewer' ? '#e50914' : '#333';
        document.getElementById('adminCreateDiv').style.display = role === 'admin' ? 'block' : 'none';
        document.getElementById('viewerJoinDiv').style.display = role === 'viewer' ? 'block' : 'none';
    }

    // ربط الدوال بالwindow
    window.setRole = setRole;
    window.createRoom = createRoom;
    window.joinRoom = joinRoom;
    window.publishVideo = publishVideo;
    window.sendMsg = sendMsg;
    window.goFullscreen = goFullscreen;
</script>
</body>
</html>
