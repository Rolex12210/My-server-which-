<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سينما الحب 🍿❤️</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * { box-sizing: border-box; }
        body { background-color: #111; color: #fff; font-family: Arial, sans-serif; text-align: center; padding: 10px; margin: 0; }
        .container { max-width: 600px; margin: 0 auto; padding-bottom: 30px; }
        h1 { color: #e50914; font-size: 22px; margin: 10px 0 5px 0; }
        
        /* كروت التحكم والبث */
        .card { background: #1a1a1a; padding: 15px; border-radius: 12px; border: 1px solid #333; margin-top: 10px; }
        input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #444; background: #222; color: white; margin-bottom: 10px; text-align: center; font-size: 14px; }
        
        button { padding: 12px 20px; background: #e50914; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 14px; margin: 5px auto; display: inline-block; }
        .btn-sec { background: #333; border: 1px solid #444; }
        
        .badge { display: inline-block; padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: bold; margin-top: 5px; }
        .room-title { font-size: 18px; color: #e50914; font-weight: bold; margin-bottom: 5px; }
        .status-card { background: #222; padding: 8px; border-radius: 8px; color: #4caf50; font-size: 14px; margin: 5px 0; font-weight: bold; }

        /* حاوية الفيديو المعزولة هندسياً لمنع خروج أزرار قوقل */
        .video-wrapper { width: 100%; border-radius: 12px; box-shadow: 0 4px 20px rgba(229, 9, 20, 0.4); background: #000; margin-top: 15px; overflow: hidden; display: none; position: relative; }
        video { width: 100%; height: auto; display: none; background: #000; }
        
        /* تحديد أبعاد صارمة وثابتة للأيفريم تمنع تمدده بالموبايل */
        iframe { width: 100%; height: 280px; border: none; display: none; background: #000; vertical-align: bottom; }
        @media (min-width: 600px) { iframe { height: 400px; } }

        /* زر تكبير الشاشة المخصص لنونة */
        .fullscreen-btn { display: none; background: #0288d1; color: white; padding: 12px 20px; font-size: 15px; border-radius: 8px; font-weight: bold; margin: 12px auto; width: 100%; border: none; cursor: pointer; }
        
        /* كارت الشات المنفصل تماماً */
        .chat-card { background: #151515; border: 1px solid #222; border-radius: 12px; margin-top: 15px; display: none; text-align: right; padding: 12px; clear: both; }
        .chat-box { height: 120px; overflow-y: auto; background: #000; border: 1px solid #333; border-radius: 8px; padding: 10px; margin-bottom: 10px; font-size: 13px; display: flex; flex-direction: column; }
        .msg { margin: 4px 0; padding: 6px 12px; border-radius: 8px; max-width: 75%; }
        .msg.me { background: #e50914; color: white; align-self: flex-start; border-bottom-right-radius: 0; }
        .msg.partner { background: #333; color: white; align-self: flex-end; border-bottom-left-radius: 0; }
        
        /* تصميم صف الشات المعدل هندسياً بدون فليكس لتفادي مشاكل الأيفون */
        .chat-input-row { width: 100%; display: block; overflow: hidden; margin-top: 5px; }
        .chat-input-row input { width: 78%; float: right; margin-bottom: 0; }
        .chat-input-row button { width: 18%; float: left; margin: 0; padding: 11px 0; }
    </style>
</head>
<body>
<div class="container">
    <h1>سينما الحب 🍿❤️</h1>
    <div id="usersBadge" class="badge" style="background:#333; display:none;">
        المتواجدون حالياً بالغرفة: <span id="countDisplay" class="users-count">1</span>
    </div>

    <div class="card" id="setupCard">
        <div style="margin-bottom: 15px;">
            <button id="adminBtn" style="background:#e50914;" onclick="setRole('ADMIN')">🎬 أنا المتحكم (مصطفى)</button>
            <button id="viewerBtn" class="btn-sec" onclick="setRole('VIEWER')">🍿 أنا المشاهد (نونة)</button>
        </div>
        <div id="adminAction">
            <button onclick="createNewRoom()">✨ إنشاء غرفة جديدة برقم قصير</button>
        </div>
        <div id="viewerAction" style="display:none; margin-top: 15px;">
            <input type="number" id="roomCodeInput" placeholder="🔢 ادخلي رقم الغرفة...">
            <br>
            <button onclick="joinExistingRoom()">💕 دخول الغرفة والاتصال بمصطفى</button>
            <p id="joinStatus" style="font-size:13px; color:#aaa;"></p>
        </div>
    </div>

    <div class="card" id="broadcastCard" style="display:none;">
        <div class="room-title">🎥 رقم الغرفة: <span id="roomCodeDisplay">----</span></div>
        <div id="statusCard" class="status-card">🟢 النظام جاهز ومستقر تلقائياً</div>
        <div id="adminInputs" style="margin-top: 15px;">
            <input type="text" id="videoUrl" placeholder="🔗 ضع رابط قوقل درايف، فودو، أو m3u8 هنا...">
            <br>
            <input type="text" id="subtitleUrl" placeholder="✍️ رابط الترجمة webvtt (اختياري للمشغل العادي)...">
            <br>
            <button onclick="loadVideo()">▶️ بث الحلقة فوراً</button>
        </div>
        <div id="viewerInputs" style="display:none; color: #aaa; margin-top:10px;">💖 انتظري مصطفى ليقوم ببث الفيلم...</div>
    </div>

    <div class="video-wrapper" id="videoWrapper">
        <video id="videoPlayer" playsinline crossorigin="anonymous" controls>
            <track id="videoTrack" kind="subtitles" srclang="ar" label="العربية" default>
        </video>
        <iframe id="drivePlayer" allow="autoplay; encrypted-media" allowfullscreen></iframe>
    </div>

    <button id="customFullscreenBtn" class="fullscreen-btn" onclick="goFullscreen()">📺 وضع ملء الشاشة الكاملة</button>

    <div class="chat-card" id="chatCard">
        <div class="chat-box" id="chatBox"></div>
        <div class="chat-input-row">
            <input type="text" id="chatInput" placeholder="✍️ اكتب رسالة..." onkeypress="handleChatKey(event)">
            <button onclick="sendChatMessage()">📨</button>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCu62w7jzvxYvxPFdd65FbACIYohoXQ3Yk",
        authDomain: "cenama-9093f.firebaseapp.com",
        databaseURL: "https://cenama-9093f-default-rtdb.firebaseio.com",
        projectId: "cenama-9093f",
        storageBucket: "cenama-9093f.firebasestorage.app",
        messagingSenderId: "106569940197",
        appId: "1:106569940197:web:a5afbdb78e97eecc5f280c"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    const video = document.getElementById('videoPlayer');
    const drivePlayer = document.getElementById('drivePlayer');
    const videoWrapper = document.getElementById('videoWrapper');
    const videoTrack = document.getElementById('videoTrack');
    const countDisplay = document.getElementById('countDisplay');
    const chatCard = document.getElementById('chatCard');
    const chatBox = document.getElementById('chatBox');
    const chatInput = document.getElementById('chatInput');
    const joinStatus = document.getElementById('joinStatus');
    const roomCodeDisplay = document.getElementById('roomCodeDisplay');
    const customFullscreenBtn = document.getElementById('customFullscreenBtn');

    let myRole = 'ADMIN';
    let currentRoomCode = null;
    let isSyncing = false;
    let hls = null;

    function setRole(role) {
        myRole = role;
        document.getElementById('adminBtn').style.background = role === 'ADMIN' ? '#e50914' : '#333';
        document.getElementById('viewerBtn').style.background = role === 'VIEWER' ? '#e50914' : '#333';
        document.getElementById('adminAction').style.display = role === 'ADMIN' ? 'block' : 'none';
        document.getElementById('viewerAction').style.display = role === 'VIEWER' ? 'block' : 'none';
    }

    function showCinemaLayout(code) {
        document.getElementById('setupCard').style.display = 'none';
        document.getElementById('broadcastCard').style.display = 'block';
        roomCodeDisplay.textContent = code;
        document.getElementById('usersBadge').style.display = 'inline-block';
        videoWrapper.style.display = 'block';
        chatCard.style.display = 'block';
        if (myRole === 'VIEWER') customFullscreenBtn.style.display = 'block';
    }

    function smartPlay(url) {
        if (!url) return;
        
        if (url.includes('drive.google.com') || url.includes('docs.google.com')) {
            let fileId = '';
            if (url.includes('/d/')) {
                fileId = url.split('/d/')[1].split('/')[0];
            } else if (url.includes('id=')) {
                fileId = url.split('id=')[1].split('&')[0];
            }

            if (fileId) {
                video.style.display = 'none';
                drivePlayer.style.display = 'block';
                drivePlayer.src = `https://drive.google.com/file/d/${fileId}/preview`;
                document.getElementById('statusCard').textContent = "🎬 سيرفر Google Drive المباشر شغال!";
                return;
            }
        }

        drivePlayer.style.display = 'none';
        video.style.display = 'block';

        if (hls) { hls.destroy(); hls = null; }

        if (url.includes('.m3u8')) {
            if (Hls.isSupported()) {
                hls = new Hls();
                hls.loadSource(url);
                hls.attachMedia(video);
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = url;
            }
        } else {
            video.src = url;
        }
    }

    function goFullscreen() {
        const p = drivePlayer.style.display === 'block' ? drivePlayer : video;
        if (p.requestFullscreen) p.requestFullscreen();
        else if (p.webkitRequestFullscreen) p.webkitRequestFullscreen();
        else if (p.mozRequestFullScreen) p.mozRequestFullScreen();
    }

    function createNewRoom() {
        currentRoomCode = Math.floor(1000 + Math.random() * 9000).toString();
        database.ref('rooms/' + currentRoomCode).set({ videoUrl: '', subtitleUrl: '', state: 'pause', currentTime: 0 });
        database.ref('rooms/' + currentRoomCode + '/viewerPresent').on('value', snap => {
            countDisplay.textContent = snap.val() ? '2' : '1';
        });
        database.ref('rooms/' + currentRoomCode + '/chat').on('child_added', snap => {
            if (snap.val().sender !== 'ADMIN') appendMessage(snap.val().text, 'partner');
        });
        showCinemaLayout(currentRoomCode);
    }

    function joinExistingRoom() {
        const code = document.getElementById('roomCodeInput').value.trim();
        if (!code) return alert('الرجاء إدخال رقم الغرفة!');
        joinStatus.textContent = 'جاري الاتصال...';
        
        database.ref('rooms/' + code).once('value', snap => {
            if (!snap.exists()) { joinStatus.textContent = '❌ الغرفة غير موجودة'; return; }
            currentRoomCode = code;
            database.ref('rooms/' + code + '/viewerPresent').set(true);

            database.ref('rooms/' + code + '/videoUrl').on('value', s => {
                if (s.val()) smartPlay(s.val());
            });

            database.ref('rooms/' + code + '/subtitleUrl').on('value', s => {
                if (s.val() && drivePlayer.style.display === 'none') {
                    videoTrack.src = s.val();
                    videoTrack.track.mode = "showing";
                }
            });

            database.ref('rooms/' + code + '/state').on('value', s => {
                if (isSyncing || myRole === 'ADMIN' || drivePlayer.style.display === 'block') return;
                isSyncing = true;
                if (s.val() === 'play') video.play().catch(()=>{});
                else video.pause();
                setTimeout(() => isSyncing = false, 200);
            });

            database.ref('rooms/' + code + '/chat').on('child_added', snap => {
                if (snap.val().sender !== 'VIEWER') appendMessage(snap.val().text, 'partner');
            });

            showCinemaLayout(code);
            document.getElementById('adminInputs').style.display = 'none';
            document.getElementById('viewerInputs').style.display = 'block';
        });
    }

    function loadVideo() {
        const url = document.getElementById('videoUrl').value.trim();
        const subUrl = document.getElementById('subtitleUrl').value.trim();
        if (url && myRole === 'ADMIN' && currentRoomCode) {
            smartPlay(url);
            database.ref('rooms/' + currentRoomCode).update({ videoUrl: url, subtitleUrl: subUrl, state: 'pause', currentTime: 0 });
        }
    }

    video.addEventListener('play', () => {
        if (!isSyncing && myRole === 'ADMIN' && currentRoomCode) database.ref('rooms/' + currentRoomCode).update({ state: 'play' });
    });
    video.addEventListener('pause', () => {
        if (!isSyncing && myRole === 'ADMIN' && currentRoomCode) database.ref('rooms/' + currentRoomCode).update({ state: 'pause' });
    });

    function sendChatMessage() {
        const text = chatInput.value.trim();
        if (text && currentRoomCode) {
            database.ref('rooms/' + currentRoomCode + '/chat').push({ text, sender: myRole });
            appendMessage(text, 'me'); chatInput.value = '';
        }
    }
    function handleChatKey(e) { if (e.key === 'Enter') sendChatMessage(); }
    function appendMessage(text, sender) {
        const d = document.createElement('div'); d.className = `msg ${sender}`; d.textContent = text;
        chatBox.appendChild(d); chatBox.scrollTop = chatBox.scrollHeight;
    }
</script>
</body>
</html>
